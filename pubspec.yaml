name: essence_plus
description: "Endless runner game - collect fuel drops, fill your tank, earn real fuel vouchers!"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game Engine
  flame: ^1.18.0
  flame_audio: ^2.10.0

  # HTTP Client
  http: ^1.2.0

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Navigation
  go_router: ^14.8.0

  # Storage
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0

  # UI
  google_fonts: ^6.2.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.0
  flutter_animate: ^4.5.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/sprites/
    - assets/images/ui/
    - assets/images/branding/
    - assets/audio/sfx/
    - assets/audio/music/

  # Fonts loaded via google_fonts package at runtime
  # To bundle offline, download Rajdhani from Google Fonts and add:
  # fonts:
  #   - family: Rajdhani
  #     fonts:
  #       - asset: assets/fonts/Rajdhani-Regular.ttf
  #       - asset: assets/fonts/Rajdhani-Bold.ttf
  #         weight: 700
