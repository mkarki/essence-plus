name: TestFlight Release

# Manual trigger only. Run via the Actions tab or:
#   gh workflow run testflight.yml -f build_name=1.0.0
#
# Prerequisites (one-off setup, manual):
#   1. App record created in App Store Connect with bundle
#      com.essenceplus.essencePlus.
#   2. App Store Connect API Key generated (role: App Manager). Save the .p8.
#   3. Repository secrets configured:
#        - ASC_KEY_ID         (e.g. ABCD1234)
#        - ASC_ISSUER_ID      (UUID)
#        - ASC_KEY_P8_BASE64  (base64 of the .p8 file)
#
# The build number auto-increments via github.run_number so each TestFlight
# upload is unique.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Marketing version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      branch:
        description: 'Branch to build'
        required: false
        default: 'claude/hormuz-game-concept-vWM4s'

jobs:
  build-and-upload:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Install ASC API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::Missing ASC_KEY_ID or ASC_KEY_P8_BASE64 secret."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build IPA (automatic signing via ASC API key)
        run: |
          flutter build ipa \
            --release \
            --build-name="${{ inputs.build_name }}" \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        id: ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA not produced."
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_PATH"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 14
