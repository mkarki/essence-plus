services:
  - type: web
    name: essence-plus-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: essence-plus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: essence-plus-db
    plan: free
    databaseName: essence_plus
